<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مذاكرتي</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#fffdfa;--beige:#f5ede2;--pink:#f8dbe6;--blue:#d9eaf7;--lav:#e6dff6;--ink:#4a4458;--mute:#8b8498;--line:#eadfd3;--ok:#cfe8d8;--bad:#f6c9cf}
*{box-sizing:border-box}
body{margin:0;font-family:'Readex Pro',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--beige);padding:22px 14px;position:sticky;top:0;height:100vh}
nav h1{font-size:18px;margin:0 8px 18px;font-weight:600}
nav button{display:block;width:100%;text-align:right;border:0;background:none;padding:11px 14px;border-radius:14px;font:inherit;color:var(--ink);cursor:pointer;margin-bottom:4px}
nav button.on{background:var(--lav);font-weight:600}
nav button:hover{background:var(--pink)}
main{padding:28px;max-width:900px;width:100%}
h2{font-weight:600;margin:0 0 4px;font-size:24px}
.sub{color:var(--mute);margin:0 0 20px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;color:var(--ink);border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 12px;min-width:0}
textarea{width:100%;min-height:70px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid #b9a8e8;outline-offset:1px}
.btn{border:0;background:var(--lav);color:var(--ink);padding:9px 16px;border-radius:12px;font:inherit;cursor:pointer}
.btn.pink{background:var(--pink)}.btn.blue{background:var(--blue)}.btn.ghost{background:none;border:1px solid var(--line)}
.chip{padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:#fff;cursor:pointer;font:inherit;font-size:13px;color:var(--ink)}
.chip.on{background:var(--blue);border-color:var(--blue)}
.tag{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;background:var(--lav);margin-inline-end:4px}
.tag.hi{background:var(--pink)}.tag.late{background:var(--bad)}.tag.mid{background:var(--beige)}
.top3{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:18px}
.top3 .card{margin:0;background:var(--pink)}.top3 .card:nth-child(2){background:var(--blue)}.top3 .card:nth-child(3){background:var(--lav)}
.bar{height:10px;border-radius:9px;background:var(--beige);overflow:hidden}.bar i{display:block;height:100%;background:#b9a8e8}
.done{text-decoration:line-through;color:var(--mute)}
.sm{font-size:13px;color:var(--mute)}
a{color:#7a63c4}
dialog{border:0;border-radius:22px;max-width:620px;width:92%;padding:22px;background:var(--bg);color:var(--ink)}
dialog::backdrop{background:#4a445855}
.opt{display:block;width:100%;text-align:right;margin:6px 0;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit;color:var(--ink);cursor:pointer}
.opt.ok{background:var(--ok)}.opt.no{background:var(--bad)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;display:none}
@media(max-width:720px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}nav{position:static;height:auto;display:flex;overflow-x:auto;gap:4px;padding:10px}nav h1{display:none}nav button{white-space:nowrap;width:auto}main{padding:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

:root{--bg:#fff;--beige:#f3effb;--pink:#f3effb;--blue:#f3effb;--lav:#e3daf6;--line:#e6def5}
.app{display:block}
#top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px}
#top button{border:0;background:var(--lav);border-radius:12px;font-size:22px;width:44px;height:44px;cursor:pointer;color:var(--ink)}
#top b{font-size:18px}
nav,nav{position:fixed;top:0;right:0;height:100vh;width:270px;z-index:20;background:#fff;box-shadow:-6px 0 24px #4a445822;transform:translateX(105%);transition:transform .2s;display:block;overflow:auto;padding:22px 14px}
nav.open{transform:none}
nav h1{display:block}
nav button{width:100%;white-space:normal;font-size:16px}
#veil{position:fixed;inset:0;background:#4a445844;z-index:15;display:none}
main{margin:0 auto}
.chip.on{background:var(--lav);border-color:var(--lav)}
@media(max-width:720px){nav{position:fixed;height:100vh;display:block;overflow:auto;padding:22px 14px}nav h1{display:block}nav button{width:100%}.app{display:block}}
@media(prefers-reduced-motion:reduce){nav{transition:none}}
</style>
</head>
<body>
<div id="top"><button onclick="toggleMenu()" aria-label="القائمة">☰</button><b id="ttl"></b></div><div id="veil" onclick="toggleMenu()"></div>
<div class="app"><nav id="nav"></nav><main id="main"></main></div>
<dialog id="dlg"></dialog><div id="toast"></div>
<script>
// ====== اربطي Supabase هنا (لو سبتيهم فاضيين الداتا بتتحفظ في المتصفح بس) ======
const SUPABASE_URL = "https://wlaeekrkdwomqxwhpcyd.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_U1IuWflw-dgGqWkHsR0QDA_25RH3iJV";
// ================================================================================

const sb = SUPABASE_URL ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const SUBJECTS = ["Pharmacology","Medical Microbiology","Clinical Pharmacy","Clinical Pharmacokinetics","Nutrition","Pharmaceutical Technology","تشريعات وإدارة وتسجيل وأخلاقيات المهنة"];
const STATUS = {new:"لسه",started:"بدأت",review:"محتاجة مراجعة",done:"خلصت"};
const PRI = {high:"عالية",mid:"متوسطة",low:"عادية"};
const T = ["tasks","lectures","ideas","questions"];
let S = {tasks:[],lectures:[],ideas:[],questions:[]}, view = "day", filter = "all", q = "";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toast = m => { const t = $("#toast"); t.textContent = m; t.style.display = "block"; setTimeout(() => t.style.display = "none", 3200); };
const fmt = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today = () => fmt(new Date());

async function load(){
  for (const t of T){
    if (sb){ const {data,error} = await sb.from(t).select("*"); if (error) toast("مشكلة في "+t+": "+error.message); S[t] = data || []; }
    else S[t] = JSON.parse(localStorage.getItem("ms_"+t) || "[]");
  }
}
async function save(t, row){
  row.id = row.id || crypto.randomUUID();
  const i = S[t].findIndex(x => x.id === row.id);
  i < 0 ? S[t].push(row) : S[t][i] = row;
  if (sb){ const {error} = await sb.from(t).upsert(row); if (error) toast(error.message); }
  else localStorage.setItem("ms_"+t, JSON.stringify(S[t]));
}
async function del(t, id){
  S[t] = S[t].filter(x => x.id !== id);
  if (sb) await sb.from(t).delete().eq("id", id); else localStorage.setItem("ms_"+t, JSON.stringify(S[t]));
  render();
}
const get = (t,id) => S[t].find(x => x.id === id);
const upd = async (t,id,patch,re=true) => { await save(t, {...get(t,id), ...patch}); if (re) render(); };

const VIEWS = {day:"يومي", subjects:"المواد", library:"مكتبة المحاضرات", tasks:"التاسكات والأسايمنتات", progress:"تقدّمي"};
let curSub = null;
function toggleMenu(){ $("#nav").classList.toggle("open"); $("#veil").style.display = $("#nav").classList.contains("open") ? "block" : "none"; }
function renderNav(){
  $("#nav").innerHTML = "<h1>مذاكرتي 🌸</h1>" + Object.entries(VIEWS).map(([k,v]) => `<button class="${view===k?"on":""}" onclick="go('${k}')">${v}</button>`).join("") + (me ? `<div class="sm" style="margin:18px 8px 4px">${esc((me.user_metadata||{}).full_name||"")}</div>` : "");
}
const go = v => { view = v; curSub = null; $("#nav").classList.remove("open"); $("#veil").style.display = "none"; render(); };
function render(){
  renderNav();
  $("#ttl").textContent = view==="subjects" && curSub ? curSub : VIEWS[view];
  $("#main").innerHTML = ({day:vDay,subjects:vSubjects,library:vLibrary,tasks:vTasks,progress:vProgress})[view]();
  if(view === "library") loadLibraryList();
}

// ---------- يومي + التاسكات ----------
function taskRow(t){ return `<div class="card row"><input type="checkbox" ${t.done?"checked":""} onchange="upd('tasks','${t.id}',{done:this.checked})"><span class="${t.done?"done":""}" style="flex:1">${esc(t.title)}</span>${t.deadline?`<span class="tag ${!t.done&&t.deadline<today()?"late":""}">${esc(t.deadline)}</span>`:""}<button class="btn ghost" onclick="del('tasks','${t.id}')">حذف</button></div>`; }
function vDay(){
  const td = today(), soon = fmt(new Date(Date.now()+3*864e5));
  const now = S.tasks.filter(t => t.deadline===td || (!t.done && t.deadline && t.deadline<td));
  const next = S.tasks.filter(t => !t.done && t.deadline>td && t.deadline<=soon);
  return `<h2>يومي</h2><p class="sub">${new Date().toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long"})}</p>
  <button class="btn" onclick="exportReminders()" style="margin-bottom:12px">🔔 فعّلي التذكيرات في تقويم موبايلي</button>
  <div class="card row"><input id="dq" placeholder="إيه اللي عايزة تعمليه النهارده؟" style="flex:1"><button class="btn" onclick="addDay()">إضافة</button></div>
  ${now.map(taskRow).join("") || `<p class="sm">مفيش حاجة النهارده 🎉</p>`}
  ${next.length ? `<h3 style="margin:18px 0 8px">قريب</h3>`+next.map(taskRow).join("") : ""}`;
}
async function addDay(){ const t = $("#dq").value.trim(); if (!t) return; await save("tasks",{title:t,deadline:today(),priority:"mid",done:false,subtasks:[]}); render(); }
function vTasks(){
  const list = [...S.tasks].sort((a,b) => a.done-b.done || (a.deadline||"9").localeCompare(b.deadline||"9"));
  return `<h2>التاسكات والأسايمنتات</h2><p class="sub">المطلوب منك من الدكاترة أو المواد، مع ميعاد التسليم.</p>
  <button class="btn" onclick="exportReminders()" style="margin-bottom:12px">🔔 فعّلي التذكيرات في تقويم موبايلي</button>
  <div class="card row"><input id="tt" placeholder="المطلوب" style="flex:1"><input id="td" type="date"><button class="btn" onclick="addTask()">إضافة</button></div>
  ${list.map(taskRow).join("") || `<p class="sm">لسه مفيش حاجة.</p>`}`;
}
async function addTask(){ const t = $("#tt").value.trim(); if (!t) return toast("اكتبي المطلوب"); await save("tasks",{title:t,deadline:$("#td").value||null,priority:"mid",done:false,subtasks:[]}); render(); }

// ---------- المذاكرة والمواد ----------

// ---------- تذكيرات في تقويم الموبايل (.ics): الليلة اللي قبل الميعاد 9 م، وصباح اليوم 8 ص ----------
function exportReminders(){
  const items = S.tasks.filter(t => !t.done && t.deadline);
  if (!items.length) return toast("مفيش مواعيد تتحط في التقويم");
  const esc2 = s => String(s).replace(/[\\,;]/g, m => "\\"+m).replace(/\n/g," ");
  const ymd = d => d.replace(/-/g,"");
  const nxt = d => { const x = new Date(d+"T00:00:00"); x.setDate(x.getDate()+1); return ymd(fmt(x)); };
  const stamp = new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  const o = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//mozakerty//AR","CALSCALE:GREGORIAN"];
  for (const t of items){
    const alarm = tr => ["BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+esc2(t.title),"TRIGGER:"+tr,"END:VALARM"];
    o.push("BEGIN:VEVENT","UID:"+t.id+"@mozakerty","DTSTAMP:"+stamp,"DTSTART;VALUE=DATE:"+ymd(t.deadline),"DTEND;VALUE=DATE:"+nxt(t.deadline),"SUMMARY:"+esc2(t.title),...alarm("-PT3H"),...alarm("PT8H"),"END:VEVENT");
  }
  o.push("END:VCALENDAR");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([o.join("\r\n")],{type:"text/calendar"})); a.download = "mozakerty.ics"; a.click();
  toast("افتحي الملف وهيتضاف في تقويمك ✅");
}


// ---------- النتايج والتقدّم ----------
const pct = (a,b) => b ? Math.round(a/b*100) : 0;
const results = () => S.ideas.filter(i => (i.tags||[]).includes("result")).map(i => { try { return JSON.parse(i.text); } catch(e){ return null; } }).filter(Boolean);
const avgOf = rs => pct(rs.reduce((s,x) => s+x.score,0), rs.reduce((s,x) => s+x.total,0));
function lecAvg(id){ const r = results().filter(x => x.lid===id); return r.length ? avgOf(r) : null; }
function wrongCounts(subject){ const c = {}; results().filter(x => !subject || x.subject===subject).forEach(x => (x.wrong||[]).forEach(id => c[id] = (c[id]||0)+1)); return c; }
function wrongQs(subject){ const c = wrongCounts(subject); return S.questions.filter(q => c[q.id]); }
function mindHtml(m){
  const br = (m.branches||[]).map(b => `<div class="card" style="background:var(--beige);margin:0"><b>${esc(b.title)}</b><ul style="margin:6px 0 0;padding-inline-start:20px">${(b.points||[]).map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>`).join("");
  const kw = (m.keywords||[]).map(k => `<tr><td><b>${esc(k.term)}</b></td><td>${esc(k.meaning)}</td><td class="sm">${esc((k.related||[]).join("، "))}</td></tr>`).join("");
  return `<div style="text-align:center;margin:10px 0"><span class="tag" style="font-size:16px;padding:6px 18px">${esc(m.center)}</span></div><div style="display:grid;gap:8px">${br}</div><h4>الكلمات المفتاحية</h4><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse"><tr class="sm"><td>المصطلح</td><td>معناه</td><td>مرتبط بـ</td></tr>${kw}</table></div>`;
}
const mindBlock = l => { try { const m = JSON.parse(l.transcript); return m && m.center ? `<div class="card"><b>🗺️ الخريطة الذهنية والكلمات المفتاحية</b>${mindHtml(m)}</div>` : ""; } catch(e){ return ""; } };
function reviewBar(list){
  const qn = S.questions.filter(q => list.some(l => l.id===q.lecture_id)).length, wn = wrongQs(curSub).length;
  const weak = list.filter(l => { const a = lecAvg(l.id); return l.status==="review" || (a!==null && a<60); });
  return `<div class="row" style="margin-bottom:12px"><button class="btn blue" onclick="subjQuiz()">اختبار شامل (${qn})</button><button class="btn" onclick="wrongQuiz()">أعيدي أسئلتي الغلط (${wn})</button></div>`+(weak.length ? `<div class="card"><b>مراجعة نهائية: ركّزي على</b>${weak.map(l => `<div class="row" style="cursor:pointer;margin-top:6px" onclick="openLec('${l.id}')"><span style="flex:1">${esc(l.title)}</span><span class="tag late">${lecAvg(l.id)===null?"محتاجة مراجعة":lecAvg(l.id)+"%"}</span></div>`).join("")}</div>` : "");
}
function vProgress(){
  const all = S.lectures, done = all.filter(l => l.status==="done").length;
  const subs = subjectsList().map(s => s.text), rs = results().sort((a,b) => b.at-a.at);
  const bar = (a,b) => `<div class="bar"><i style="width:${pct(a,b)}%"></i></div>`;
  const strong = [], weak = [];
  all.forEach(l => { const a = lecAvg(l.id); if (a===null) return; if (a>=75) strong.push(l.title+" ("+a+"%)"); else if (a<60) weak.push(l.title+" ("+a+"%)"); });
  const rep = Object.entries(wrongCounts()).filter(([,n]) => n>=2).map(([id]) => get("questions",id)).filter(Boolean);
  const todo = all.filter(l => { const a = lecAvg(l.id); return l.status==="new" || l.status==="review" || (a!==null && a<60); }).slice(0,3);
  const l3 = rs.slice(0,3), p3 = rs.slice(3,6);
  const trend = l3.length && p3.length ? (avgOf(l3) > avgOf(p3) ? "بتتحسّني ↗" : avgOf(l3) < avgOf(p3) ? "النتايج نازلة شوية ↘ راجعي" : "ثابتة") : "محتاجة اختبارين تلاتة كمان عشان نعرف";
  const li = a => a.length ? a.map(x => `<div>• ${esc(x)}</div>`).join("") : `<div class="sm">لسه مفيش بيانات كفاية</div>`;
  const nm = x => x.lid ? ((get("lectures",x.lid)||{}).title||"") : (x.subject||"")+" (شامل)";
  return `<h2>تقدّمي</h2><p class="sub">كل اللي خلّصتيه ومستواك في مكان واحد.</p>
  <div class="card"><b>الإجمالي: ${pct(done,all.length)}%</b><div class="sm">${done} محاضرة خلصت من ${all.length}</div>${bar(done,all.length)}</div>
  ${subs.map(n => { const ls = all.filter(l => l.subject===n), d = ls.filter(l => l.status==="done").length, s = ls.filter(l => l.status==="started"||l.status==="review").length; return `<div class="card"><b>${esc(n)}: ${pct(d,ls.length)}%</b><div class="sm">خلصت ${d} · شغالة ${s} · لسه ${ls.length-d-s}</div>${bar(d,ls.length)}</div>`; }).join("")}
  <div class="card"><b>🎯 توصياتي ليكي</b>${li(todo.map(l => l.subject+" — "+l.title))}</div>
  <div class="card"><b>💪 نقاط القوة</b>${li(strong)}<b style="display:block;margin-top:10px">⚠️ نقاط الضعف</b>${li(weak)}</div>
  <div class="card"><b>🔁 أسئلة بتغلطي فيها كتير</b>${li(rep.map(q => q.q))}</div>
  <div class="card"><b>📒 سجل المذاكرة</b><div class="sm">محاضرات اتذاكرت: ${done} · اختبارات اتحلّت: ${rs.length} · مستواك: ${trend}</div>${rs.slice(0,6).map(x => `<div class="row" style="margin-top:6px"><span style="flex:1">${esc(nm(x))}</span><span class="tag">${x.score}/${x.total}</span><span class="sm">${new Date(x.at).toLocaleDateString("ar-EG")}</span></div>`).join("")}</div>`;
}

const subjectsList = () => S.ideas.filter(i => (i.tags||[]).includes("subject"));
function vSubjects(){
  if (!curSub){
    return `<h2>المواد</h2><p class="sub">ضيفي موادك، وافتحي أي مادة عشان تشوفي محاضراتها.</p>
    <div class="card row"><input id="sn" placeholder="اسم المادة" style="flex:1"><button class="btn" onclick="addSub()">إضافة</button></div>
    ${subjectsList().map(s => `<div class="card row" style="cursor:pointer" onclick="curSub=this.dataset.n;render()" data-n="${esc(s.text)}"><b style="flex:1">${esc(s.text)}</b><span class="sm">${S.lectures.filter(l => l.subject===s.text).length} محاضرة</span><button class="btn ghost" onclick="event.stopPropagation();if(confirm('تمسحي المادة؟'))del('ideas','${s.id}')">حذف</button></div>`).join("") || `<p class="sm">لسه مفيش مواد، ضيفي أول مادة من فوق.</p>`}`;
  }
  const list = S.lectures.filter(l => l.subject===curSub);
  return `<button class="btn ghost" onclick="curSub=null;render()" style="margin-bottom:12px">← المواد</button>${reviewBar(list)}
  <div class="card row"><input id="lt" placeholder="اسم المحاضرة الجديدة" style="flex:1"><button class="btn" onclick="addLec()">إضافة</button></div>
  ${list.map(l => `<div class="card row" style="cursor:pointer" onclick="openLec('${l.id}')"><b style="flex:1">${esc(l.title)}</b><span class="tag mid">${STATUS[l.status]}</span><span class="sm">${S.questions.filter(x => x.lecture_id===l.id).length} سؤال</span></div>`).join("") || `<p class="sm">ضيفي أول محاضرة من فوق.</p>`}`;
}
async function addSub(){ const n = $("#sn").value.trim(); if (!n) return toast("اكتبي اسم المادة"); await save("ideas",{text:n,tags:["subject"]}); render(); }
async function addLec(){ const t = $("#lt").value.trim(); if (!t) return toast("اكتبي اسم المحاضرة"); await save("lectures",{subject:curSub,title:t,status:"new",difficulty:2,summary:"",pdf_url:"",video_url:"",record_url:"",key_points:""}); render(); }

// ---------- الاختبار ----------
let qs = [], qi = 0, score = 0, wrong = [], qctx = {};
function startQuiz(list,ctx){ if (!list.length) return toast("مفيش أسئلة هنا لسه"); qs = list; qi = 0; score = 0; wrong = []; qctx = ctx; showQ(); if (!$("#dlg").open) $("#dlg").showModal(); }
const openQuiz = id => { const l = get("lectures",id); startQuiz(S.questions.filter(x => x.lecture_id===id),{lid:id,subject:l.subject}); };
const subjQuiz = () => startQuiz(S.questions.filter(q => { const l = get("lectures",q.lecture_id); return l && l.subject===curSub; }),{lid:null,subject:curSub});
const wrongQuiz = () => startQuiz(wrongQs(curSub),{lid:null,subject:curSub});
function finishQuiz(){ save("ideas",{text:JSON.stringify({lid:qctx.lid,subject:qctx.subject,score,total:qs.length,at:Date.now(),wrong}),tags:["result"]}); }
function showQ(){
  const d = $("#dlg");
  if (qi >= qs.length){ finishQuiz(); d.innerHTML = `<h2>خلصتي 🎉</h2><p>النتيجة: ${score} من ${qs.length} (${pct(score,qs.length)}%)</p><p class="sm">الأسئلة اللي غلطتي فيها اتسجّلت وتقدري تعيديها من صفحة المادة.</p><button class="btn" onclick="$('#dlg').close();render()">قفل</button>`; return; }
  const x = qs[qi];
  d.innerHTML = `<div class="sm">سؤال ${qi+1} من ${qs.length}</div><h3>${esc(x.q)}</h3>${(x.options||[]).map((o,i) => `<button class="opt" onclick="pick(this,${i})">${esc(o)}</button>`).join("")}<div id="ex" class="sm"></div><div class="row" style="margin-top:10px"><button class="btn" id="nx" style="display:none" onclick="qi++;showQ()">التالي</button><button class="btn ghost" onclick="$('#dlg').close();render()">قفل</button></div>`;
}
function pick(b,i){ const x = qs[qi], all = [...document.querySelectorAll(".opt")]; if (all[0].disabled) return;
  all.forEach((o,j) => { o.disabled = true; if (j===x.answer) o.classList.add("ok"); });
  if (i===x.answer) score++; else { b.classList.add("no"); wrong.push(x.id); }
  $("#ex").innerHTML = (i===x.answer?"✅ إجابتك صح":"❌ إجابتك غلط — الصح باللون الأخضر")+"<br>"+esc(x.explanation||""); $("#nx").style.display = "inline-block"; }

async function saveQ(lid){ const o = [0,1,2,3].map(i => $("#o"+i).value.trim()).filter(Boolean); if (!$("#nq").value.trim() || o.length<2) return toast("اكتبي السؤال واختيارين على الأقل");

const G = "/api/gemini";
const SYS = "إنتي مدرّسة خصوصي لطالبة صيدلة في مصر. اشرحي بالعامية المصرية البسيطة، واكتبي المصطلحات الطبية والأدوية بالإنجليزي. لو المحتوى ريكورد أو فيديو: ركّزي على اللي الدكتور شدّد عليه وكرّره وعلى أمثلته. اعتمدي على المحتوى المرفوع بس، ولو المعلومة مش موجودة فيه قولي كده.";
const TASKS = {
  explain: "اشرحي المحتوى ده بطريقة بسيطة وواضحة ومتقنة: قسّميه لأجزاء صغيرة بعناوين، ووضّحي الأفكار المهمة واربطي بينها وبين بعض، ومثّلي لأي حاجة صعبة.",
  summarize: "لخّصي المحتوى في نقط، وفي الآخر اكتبي قسم 'اللي غالبًا هييجي في الامتحان' واللي الدكتور ركّز عليه.",
  quiz: 'اعملي أسئلة على أهم أجزاء المحتوى وبنفس أسلوب الدكتور وأمثلته لو موجودة. العدد حسب حجم المحتوى (من 5 لـ 15). نوّعي: اختيار من متعدد (4 اختيارات) وصح/خطأ، ورتّبيها من السهل للمتوسط للصعب. رجّعي JSON array بس، كل عنصر: {"q":"","options":[],"answer":0,"explanation":""} و answer رقم الإجابة الصح (يبدأ من 0)، والشرح يوضّح ليه الإجابة صح أو غلط.',
  mind: 'اعملي خريطة ذهنية بسيطة لأهم نقط المحتوى، وكلمات مفتاحية مع معناها وربطها ببعض. رجّعي JSON object بس: {"center":"عنوان المحاضرة","branches":[{"title":"","points":["",""]}],"keywords":[{"term":"","meaning":"","related":["",""]}]}'
};
async function gUpload(f){
  const mime = f.type || (/\.pdf$/i.test(f.name) ? "application/pdf" : "application/octet-stream");
  // Start a resumable upload without sending the whole file through the Vercel function.
  const start = await fetch(G,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"startUpload",name:f.name,mime,size:f.size})});
  const sj = await start.json(); if(!start.ok) throw new Error(sj.error||"تعذّر بدء رفع الملف");
  const uploaded = await fetch(sj.uploadUrl,{method:"POST",headers:{"X-Goog-Upload-Offset":"0","X-Goog-Upload-Command":"upload, finalize","Content-Type":mime},body:f});
  const uj = await uploaded.json().catch(()=>({}));
  if(!uploaded.ok) throw new Error(uj?.error?.message||"فشل رفع الملف إلى جوجل. قد يكون الملف أكبر من الحدود التي تدعمها الخدمة.");
  let file = uj.file || uj;
  for(let i=0; file && file.state==="PROCESSING" && i<30; i++){
    await new Promise(r=>setTimeout(r,1500));
    const check=await fetch(G,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"checkUpload",fileName:file.name})});
    const cj=await check.json(); if(!check.ok) throw new Error(cj.error||"تعذّر تجهيز الملف"); file=cj;
  }
  if(!file?.uri || file.state==="FAILED" || file.state==="PROCESSING") throw new Error("جوجل لم يكتمل من تجهيز الملف. جرّبي ملفًا أصغر أو الصقي نص المحاضرة.");
  return {file_data:{mime_type:mime,file_uri:file.uri}};
}
async function aiRun(id,task){
  const f = $("#aif").files[0], text = $("#ait").value.trim(), question = $("#aiq").value.trim();
  if (!f && !text) return toast("ارفعي ملف أو الصقي نص الأول");
  if (task==="ask" && !question) return toast("اكتبي سؤالك");
  const out = $("#aiout"); out.style.display = "block"; out.textContent = "بشتغل… الملفات الكبيرة ممكن تاخد وقت حسب دعم الخدمة والاتصال ⏳";
  try{
    const parts = [];
    if (f){ if ((f.type||"").startsWith("text/") || /\.txt$/i.test(f.name)) parts.push({text:await f.text()}); else parts.push(await gUpload(f)); }
    if (text) parts.push({text});
    parts.push({text: task==="ask" ? "جاوبي على السؤال ده من المحتوى: "+question : TASKS[task]+(question?"\nملاحظة من الطالبة: "+question:"")});
    const body = {system_instruction:{parts:[{text:SYS}]}, contents:[{parts}]};
    if (task==="quiz" || task==="mind") body.generationConfig = {responseMimeType:"application/json"};
    const r = await fetch(G, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({action:"generate",body})});
    const j = await r.json(); if (!r.ok) throw new Error(j.error||"خطأ من الـ AI");
    const res = (j.candidates&&j.candidates[0].content.parts||[]).map(p => p.text||"").join("");
    if (task==="mind"){ const m = JSON.parse(res); await upd("lectures",id,{transcript:JSON.stringify(m)},false); out.innerHTML = mindHtml(m); }
    else if (task==="quiz"){
      const qs2 = JSON.parse(res);
      for (const x of qs2) await save("questions",{lecture_id:id,q:x.q,options:x.options,answer:x.answer,explanation:x.explanation||""});
      out.textContent = "اتعملت "+qs2.length+" سؤال ✅ اضغطي «ابدئي الاختبار».";
    } else { aiText = res; out.innerHTML = esc(aiText)+`<div style="margin-top:10px"><button class="btn blue" onclick="saveNote('${id}')">احفظيه في المحاضرة</button></div>`; }
  }catch(e){ out.textContent = "حصلت مشكلة: "+(e.message||e)+"\n\nلو المشكلة ظهرت عند رفع الملف، جرّبي مؤقتًا لصق جزء من المحاضرة في مربع النص. لو النص كمان مش شغال، فالمشكلة غالبًا في مفتاح Gemini أو إعداداته، مش في الملف."; }
}
async function saveNote(id){ const l = get("lectures",id); await upd("lectures",id,{key_points:(l.key_points?l.key_points+"\n\n":"")+aiText},false); toast("اتحفظ ✅"); }


// ---------- مكتبة المحاضرات والمصادر: ملفات متعددة محفوظة على نفس الجهاز ----------
let libraryDb;
function openLibraryDB(){
  return new Promise((resolve,reject)=>{
    if(!window.indexedDB) return reject(new Error("المتصفح لا يدعم حفظ الملفات محليًا"));
    const req=indexedDB.open("MozakertyLibrary",1);
    req.onupgradeneeded=()=>{ const db=req.result; if(!db.objectStoreNames.contains("files")){ const st=db.createObjectStore("files",{keyPath:"id"}); st.createIndex("subject","subject",{unique:false}); } };
    req.onsuccess=()=>{libraryDb=req.result;resolve(libraryDb)}; req.onerror=()=>reject(req.error);
  });
}
async function libraryPut(row){ const db=libraryDb||await openLibraryDB(); return new Promise((resolve,reject)=>{const tx=db.transaction("files","readwrite");tx.objectStore("files").put(row);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);}); }
async function libraryAll(){ const db=libraryDb||await openLibraryDB(); return new Promise((resolve,reject)=>{const r=db.transaction("files","readonly").objectStore("files").getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error);}); }
async function libraryDelete(id){ const db=libraryDb||await openLibraryDB(); return new Promise((resolve,reject)=>{const tx=db.transaction("files","readwrite");tx.objectStore("files").delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);}); }
function vLibrary(){
  const subs=subjectsList().map(s=>s.text);
  return `<h2>مكتبة المحاضرات والمصادر 📚</h2><p class="sub">ارفعي أكتر من ملف ونظّمي المحاضرات والكتب والفيديوهات والتسجيلات حسب المادة.</p>
  <div class="card" style="background:var(--beige)"><label><b>المادة</b></label><select id="libsub" style="width:100%;margin:6px 0 10px"><option value="">اختاري المادة (اختياري)</option>${subs.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("")}</select>
  <label><b>نوع المصدر</b></label><select id="libtype" style="width:100%;margin:6px 0 10px"><option>محاضرة</option><option>كتاب</option><option>فيديو</option><option>تسجيل صوتي</option><option>ملف أو ملخص</option><option>مصدر آخر</option></select>
  <input id="libfiles" type="file" multiple accept=".pdf,.txt,.doc,.docx,.ppt,.pptx,.epub,audio/*,video/*" style="width:100%;background:white;padding:12px">
  <p class="sm">يمكن اختيار عدة ملفات مرة واحدة. الملفات محفوظة على هذا الجهاز والمتصفح، وليست متزامنة تلقائيًا بين الأجهزة.</p><button class="btn" onclick="uploadLibraryFiles()">حفظ الملفات في المكتبة</button></div>
  <div class="row" style="margin:12px 0"><input id="libsearch" placeholder="ابحثي باسم الملف أو المادة" oninput="loadLibraryList()" style="flex:1"><select id="libfilter" onchange="loadLibraryList()"><option value="">كل الأنواع</option><option>محاضرة</option><option>كتاب</option><option>فيديو</option><option>تسجيل صوتي</option><option>ملف أو ملخص</option><option>مصدر آخر</option></select></div>
  <div id="librarylist"><p class="sm">جاري تحميل الملفات…</p></div>`;
}
async function uploadLibraryFiles(){
  const input=$("#libfiles"), files=[...(input?.files||[])]; if(!files.length)return toast("اختاري ملف واحد على الأقل");
  const subject=$("#libsub").value, type=$("#libtype").value;
  try{ for(const f of files){ await libraryPut({id:crypto.randomUUID(),name:f.name,subject,type,size:f.size,mime:f.type||"application/octet-stream",added:Date.now(),blob:f}); }
    input.value=""; toast("اتحفظ "+files.length+" ملف في المكتبة ✅"); await loadLibraryList();
  }catch(e){toast("مقدرتش أحفظ الملفات: "+(e.message||e));}
}
function prettySize(n){if(n<1024)return n+" B";if(n<1048576)return (n/1024).toFixed(1)+" KB";return (n/1048576).toFixed(1)+" MB";}
async function loadLibraryList(){
  const target=$("#librarylist"); if(!target)return;
  try{const all=await libraryAll(), search=($("#libsearch")?.value||"").toLowerCase(), type=$("#libfilter")?.value||"";
    const list=all.filter(x=>(!search||(x.name+" "+x.subject).toLowerCase().includes(search))&&(!type||x.type===type)).sort((a,b)=>b.added-a.added);
    target.innerHTML=list.length?list.map(x=>`<div class="card row"><div style="flex:1;min-width:160px"><b>${esc(x.name)}</b><div class="sm">${esc(x.subject||"من غير مادة")} · ${esc(x.type)} · ${prettySize(x.size)}</div></div><button class="btn blue" onclick="downloadLibraryFile('${x.id}')">فتح / تنزيل</button><button class="btn ghost" onclick="removeLibraryFile('${x.id}')">حذف</button></div>`).join(""):`<div class="card sm">المكتبة فاضية لسه. ارفعي ملفاتك من فوق.</div>`;
  }catch(e){target.innerHTML=`<div class="card">تعذّر فتح المكتبة: ${esc(e.message||e)}</div>`;}
}
async function downloadLibraryFile(id){const x=(await libraryAll()).find(y=>y.id===id);if(!x)return;const url=URL.createObjectURL(x.blob),a=document.createElement("a");a.href=url;a.download=x.name;a.target="_blank";a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);}
async function removeLibraryFile(id){if(!confirm("تحذفي الملف من المكتبة؟"))return;await libraryDelete(id);await loadLibraryList();toast("اتحذف الملف");}

// ---------- خزنة الأفكار ----------
function ideaList(){
  const k = q.trim().toLowerCase();
  const list = S.ideas.filter(i => !k || i.text.toLowerCase().includes(k) || (i.tags||[]).some(t => t.toLowerCase().includes(k)));
  return list.map(i => `<div class="card"><div style="white-space:pre-wrap">${esc(i.text)}</div><div class="row" style="margin-top:6px">${(i.tags||[]).map(t => `<span class="tag">${esc(t)}</span>`).join("")}<button class="btn ghost" style="margin-inline-start:auto" onclick="del('ideas','${i.id}')">حذف</button></div></div>`).join("") || `<p class="sm">مفيش أفكار مطابقة.</p>`;
}
function vIdeas(){
  return `<h2>خزنة الأفكار</h2><p class="sub">سجّلي أي فكرة بسرعة وارجعيلها بالبحث.</p>
  <div class="card"><textarea id="it" placeholder="الفكرة أو الملاحظة"></textarea><div class="row" style="margin-top:8px"><input id="ig" placeholder="كلمات مفتاحية بفاصلة: دراسة، تيم، تطوع" style="flex:1"><button class="btn" onclick="addIdea()">حفظ</button></div></div>

  <div id="ilist">${ideaList()}</div>`;
}
async function addIdea(){ const t = $("#it").value.trim(); if (!t) return; await save("ideas",{text:t,tags:$("#ig").value.split(/[,،]/).map(s => s.trim()).filter(Boolean)}); render(); }

// ---------- الدخول والتسجيل ----------
let me = null;
async function boot(){
  try{
    if (!sb){ await load(); return render(); }
    const {data} = await sb.auth.getSession(); me = data.session ? data.session.user : null;
    me ? start() : authView();
  }catch(e){ $("#main").innerHTML = `<div class="card">حصلت مشكلة في فتح الموقع: ${esc(e.message||e)}</div>`; }
}
async function start(){
  $("#top").style.display = ""; $("#nav").style.display = ""; document.querySelector(".app").style.gridTemplateColumns = "";
  $("#main").innerHTML = `<p class="sub">ثانية، بحمّل بياناتك…</p>`; renderNav();
  try{ await load(); }catch(e){ toast("مشكلة في تحميل البيانات: "+(e.message||e)); }
  try{ render(); }catch(e){ $("#main").innerHTML = `<div class="card">مشكلة في العرض: ${esc(e.message||e)}</div>`; }
}
function authView(){
  $("#nav").innerHTML = ""; $("#nav").style.display = "none"; $("#top").style.display = "none"; document.querySelector(".app").style.gridTemplateColumns = "1fr";
  $("#main").innerHTML = `<div class="card" style="max-width:380px;margin:8vh auto;background:var(--beige)"><h2>أهلًا بيكي 🌸</h2><p class="sub">اكتبي اسمك وسنتك الدراسية وابدئي.</p>
  <input id="an" placeholder="اسمك" style="width:100%;margin-bottom:8px">
  <select id="ay" style="width:100%;margin-bottom:12px"><option value="">إنتي في أنهي فرقة؟</option><option value="1">الفرقة الأولى</option><option value="2">الفرقة الثانية</option><option value="3">الفرقة الثالثة</option><option value="4">الفرقة الرابعة</option><option value="5">الفرقة الخامسة</option></select>
  <button class="btn" style="width:100%" onclick="doAuth()">ابدأي</button><div id="ae2" class="sm" style="color:#b0455a;margin-top:8px"></div></div>`;
}
async function doAuth(){
  const name = $("#an").value.trim(), y = $("#ay").value, err = $("#ae2");
  if (!name || !y) return err.textContent = "اكتبي اسمك واختاري الفرقة بتاعتك";
  const {data,error} = await sb.auth.signInAnonymously({options:{data:{full_name:name,year:y,is_fourth_year:y==="4"}}});
  if (error) return err.textContent = "مشكلة: "+error.message;
  me = data.user; $("#nav").style.display = ""; document.querySelector(".app").style.gridTemplateColumns = ""; start();
}
boot();
